<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kanish Mahato</title>
<meta name="description" content="Kanish Mahato, AI engineer in Chandigarh building agentic LLM systems, ML research pipelines and full-stack web apps." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Klee+One&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script>document.documentElement.classList.add("js"); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");</script>
<svg class="grain" aria-hidden="true"><filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" /><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0.16 0" /></filter><rect width="100%" height="100%" filter="url(#grain-f)" /></svg>
<a class="skip" href="#work">Skip to content</a>
<div class="progress" aria-hidden="true"><span id="progress"></span></div>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<header class="site-head">
  <a class="seal" href="#top" aria-label="Kanish Mahato, back to top"><span lang="ja" aria-hidden="true">間</span></a>
  <nav aria-label="Main"><a href="#work">Work</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#contact">Contact</a></nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="name">
    <div class="ink" role="img" aria-label="A single brushed ink circle above soft ink-wash mountains, with a red seal stamp.">
      <svg class="layer" id="m-far" data-speed="0.38" aria-hidden="true"></svg>
      <svg class="layer" id="m-mid" data-speed="0.24" aria-hidden="true"></svg>
      <div class="layer enso-layer" data-speed="0.16" aria-hidden="true">
        <div class="enso-wrap" id="enso-wrap">
          <video id="enso-video" muted playsinline preload="auto" poster="enso-poster.webp" disablepictureinpicture>
            <source src="enso.webm" type="video/webm" />
            <source src="enso.mp4" type="video/mp4" />
          </video>
          <span class="seal-stamp" lang="ja">和</span>
        </div>
      </div>
      <svg class="layer" id="m-near" data-speed="0.08" aria-hidden="true"></svg>
    </div>
    <div class="intro" data-speed="0.3">
      <h1 id="name" aria-label="Kanish Mahato"><span class="line">Kanish</span><span class="line">Mahato</span></h1>
      <p class="role" data-text="role"></p>
      <p class="note">Chandigarh, India. Open to AI engineering roles.</p>
    </div>
    <p class="tate hero-tate" lang="ja" data-speed="0.5">カニシュ・マハト</p>
    <p class="tate hero-tate-sub" lang="ja" data-speed="0.56">人工知能技術者</p>
  </section>

  <section class="chapter" id="about" aria-label="About">
    <div class="body"><p class="bio" data-text="bio"></p></div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">自己紹介</p>
  </section>

  <section class="chapter" id="work" aria-labelledby="work-h">
    <div class="body">
      <h2 class="label" id="work-h">Selected work</h2>
      <div class="works" id="works"></div>
    </div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">作品</p>
  </section>

  <section class="chapter" id="experience" aria-labelledby="exp-h">
    <div class="body">
      <h2 class="label" id="exp-h">Experience</h2>
      <div class="jobs" id="jobs"></div>
    </div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">経歴</p>
  </section>

  <section class="chapter black-dot" id="skills" aria-labelledby="skills-h">
    <div class="body">
      <h2 class="label" id="skills-h">Skills</h2>
      <div class="skills" id="skill-list"></div>
    </div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">技術</p>
  </section>

  <section class="chapter black-dot" id="learning" aria-labelledby="learn-h">
    <div class="body">
      <h2 class="label" id="learn-h">Education</h2>
      <div class="learning" id="learning-body"></div>
    </div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">学び</p>
  </section>

  <section class="chapter" id="contact" aria-labelledby="contact-h">
    <div class="body contact-body">
      <div>
        <h2 class="label" id="contact-h">Contact</h2>
        <p class="big">Write to me.</p>
        <p class="mail"><span id="mail" data-text="email"></span></p>
        <p class="mail-actions"><a id="mailto">Open email</a><button type="button" id="copy">Copy email</button></p>
        <form id="form" class="form" novalidate>
          <label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required />
          <label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required />
          <label for="f-msg">Message</label><textarea id="f-msg" name="message" rows="4" required></textarea>
          <button type="submit">Send message</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <!-- The 3D cherry tree from the first portfolio; it turns as you scroll past -->
      <div class="tree-box" id="tree" role="img" aria-label="A cherry tree in full bloom, shedding petals."></div>
    </div>
    <p class="tate chapter-title" lang="ja" aria-hidden="true">連絡</p>
  </section>
</main>

<footer class="site-foot"><span>© <span data-year></span> Kanish Mahato</span><span><a id="gh">GitHub</a><a id="li">LinkedIn</a></span></footer>

<script src="content.js"></script>
<script src="common.js"></script>
<script src="main.js"></script>
<script type="module" src="tree.js"></script>
</body>
</html>
